[tool.poetry]
name = "poetry-data-server"
version = "1.0.0"
description = "古诗词数据 API 服务 - FastAPI"
authors = ["nalansitan"]
readme = "README.md"
packages = [{include = "poetry_data_server.py"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
python-multipart = "^0.0.6"
opencc-python-reimplemented = "^0.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
httpx = "^0.26.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
serve = "poetry_data_server:main"
generate = "poetry_data_server:generate_static_files"
convert = "data_converter:main"
