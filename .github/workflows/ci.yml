name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Temporary placeholder: restore the real Gradle test/lint/build job tracked in TODO.md.
      - name: Android CI placeholder
        run: |
          test -x ./gradlew
          test -f app/build.gradle.kts
          echo "Android CI is temporarily mocked; local test, lint, and builds remain available."

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry==2.1.2
      - run: poetry install --no-interaction
      - run: poetry run pytest
      - run: poetry check --lock
