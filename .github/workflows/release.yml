name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      POETRY_BASE_URL: ${{ vars.POETRY_BASE_URL || 'https://example.com/' }}
      POETRY_DATABASE_URL: ${{ vars.POETRY_DATABASE_URL }}
      POETRY_DATABASE_SHA256: ${{ vars.POETRY_DATABASE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the retired SDK "tools" package.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release configuration
        run: |
          if [[ ! "$POETRY_BASE_URL" =~ ^https://.+/$ ]]; then
            echo "Repository variable POETRY_BASE_URL must be an HTTPS URL ending with /." >&2
            exit 1
          fi
          if [[ -n "$POETRY_DATABASE_URL" ]]; then
            [[ "$POETRY_DATABASE_URL" == https://* ]] || exit 1
            [[ "$POETRY_DATABASE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || exit 1
          elif [[ "$POETRY_BASE_URL" == "https://example.com/" ]]; then
            echo "Set POETRY_DATABASE_URL and POETRY_DATABASE_SHA256, or a real POETRY_BASE_URL." >&2
            exit 1
          fi
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          if [[ "${GITHUB_REF_NAME}" != "v${version_name}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android versionName ${version_name}." >&2
            exit 1
          fi
          version_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "versionName must use major.minor or major.minor.patch." >&2
            exit 1
          fi
          IFS=. read -ra version_parts <<< "$version_name"
          major=${version_parts[0]}
          minor=${version_parts[1]}
          patch=${version_parts[2]:-0}
          if (( 10#$minor > 99 || 10#$patch > 99 || 10#$major > 210000 )); then
            echo "Version components exceed the supported versionCode range." >&2
            exit 1
          fi
          expected_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if [[ "$version_code" != "$expected_code" ]]; then
            echo "versionCode ${version_code} must equal ${expected_code} for versionName ${version_name}." >&2
            exit 1
          fi
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
      - name: Write signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${STORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          def escape(value):
              raw = value.encode("utf-16-be")
              return ''.join("\\u" + raw[i:i+2].hex() for i in range(0, len(raw), 2))
          values = {"STORE_FILE": os.environ["RUNNER_TEMP"] + "/release.jks",
                    "STORE_PASSWORD": os.environ["STORE_PASSWORD"],
                    "KEY_ALIAS": os.environ["KEY_ALIAS"], "KEY_PASSWORD": os.environ["KEY_PASSWORD"]}
          Path("keystore.properties").write_text("".join(f"{key}={escape(value)}\n" for key, value in values.items()))
          PYTHON
      - name: Build signed APK
        run: >-
          ./gradlew test lint assembleRelease
          -PPOETRY_BASE_URL="$POETRY_BASE_URL"
          -PPOETRY_DATABASE_URL="$POETRY_DATABASE_URL"
          -PPOETRY_DATABASE_SHA256="$POETRY_DATABASE_SHA256"
      - name: Verify APK signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/*.apk
      - name: Create checksums
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/
          cd release-assets
          sha256sum *.apk > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
